<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bike + Train Navigator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <nav class="navbar">
        <div class="logo">🚲 + 🚆 <span class="brand-name">VeloRail</span></div>
      </nav>
      
      <main class="main-layout">
        <aside class="sidebar">
          <div class="search-container">
            <h1>Plan your trip</h1>

            <!-- Collapsed State: Destination Only -->
            <div id="search-collapsed" class="search-state">
              <div class="input-group">
                <label for="end">Where to?</label>
                <input type="text" id="end" placeholder="Enter destination" />
              </div>
              <div id="location-status" class="location-status">
                <span class="status-icon"></span>
                <span class="status-text">Getting your location...</span>
              </div>
            </div>

            <!-- Expanded State: Both Fields -->
            <div id="search-expanded" class="search-state hidden">
              <div class="input-group">
                <label for="start">From</label>
                <div class="location-input-wrapper">
                  <input type="text" id="start" placeholder="Your Location" />
                  <button id="use-location-btn" class="location-btn" type="button" title="Use my location">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="3"></circle>
                      <path d="M12 2v4m0 12v4m10-10h-4M6 12H2"></path>
                    </svg>
                  </button>
                </div>
              </div>
              <div class="input-group">
                <label for="end-expanded">To</label>
                <input type="text" id="end-expanded" placeholder="Enter destination" />
              </div>
            </div>

            <!-- Shared Controls (always visible) -->
            <div class="input-group">
              <label for="travel-mode">Travel Mode</label>
              <select id="travel-mode">
                <option value="all">All Options</option>
                <option value="bike">Bike + Rail Only</option>
                <option value="walk">Walk + Rail Only</option>
                <option value="driving">Driving Only</option>
              </select>
            </div>
            <div class="input-group">
              <label for="bike-safety">Bike Route Preference</label>
              <select id="bike-safety">
                <option value="balanced">Balanced (Default)</option>
                <option value="safe">Safer Route (Prefer Bike Lanes)</option>
                <option value="fast">Fastest (Direct)</option>
              </select>
            </div>
            <button id="find-route-btn" class="primary-btn">Find Route</button>
          </div>
          <div id="route-details" class="route-details hidden">
            <!-- Route info will go here -->
          </div>
        </aside>
        
        <div id="map-container" class="map-container">
          <!-- Map will be rendered here -->
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
