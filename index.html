<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeloRail - Bike + Train Navigator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Full-screen Map (background) -->
      <div id="map-container" class="map-fullscreen"></div>

      <!-- Floating Search Card (top-left) -->
      <div id="search-card" class="floating-card">
        <div class="search-header">
          <span class="logo">🚲 + 🚆</span>
          <span class="brand-name">VeloRail</span>
        </div>

        <!-- Collapsed State: Destination Only -->
        <div id="search-collapsed" class="search-state">
          <div class="input-group autocomplete-wrapper">
            <input type="text" id="end" placeholder="Where to?" autocomplete="off" />
            <div class="autocomplete-dropdown" id="end-dropdown"></div>
          </div>
          <div id="location-status" class="location-status clickable">
            <span class="status-icon"></span>
            <span class="status-text">Getting your location...</span>
          </div>
        </div>

        <!-- Expanded State: Both Fields -->
        <div id="search-expanded" class="search-state hidden">
          <div class="input-group autocomplete-wrapper">
            <div class="location-input-wrapper">
              <input type="text" id="start" placeholder="Your Location" autocomplete="off" />
              <button id="use-location-btn" class="location-btn" type="button" title="Use my location">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M12 2v4m0 12v4m10-10h-4M6 12H2"></path>
                </svg>
              </button>
            </div>
            <div class="autocomplete-dropdown" id="start-dropdown"></div>
          </div>
          <div class="input-group autocomplete-wrapper">
            <input type="text" id="end-expanded" placeholder="Where to?" autocomplete="off" />
            <div class="autocomplete-dropdown" id="end-expanded-dropdown"></div>
          </div>
        </div>

        <!-- Departure Time Selector -->
        <div id="time-selector" class="time-selector">
          <label class="time-option">
            <input type="radio" name="departure-time" value="now" checked />
            <span>Leave now</span>
          </label>
          <label class="time-option">
            <input type="radio" name="departure-time" value="depart" />
            <span>Depart at</span>
          </label>
          <input type="datetime-local" id="custom-time" class="custom-time hidden" />
        </div>

        <!-- Options Row (inside search card) -->
        <div id="options-row" class="options-row">
          <select id="travel-mode">
            <option value="all">All Options</option>
            <option value="bike">Bike + Rail</option>
            <option value="walk">Walk + Rail</option>
            <option value="driving">Driving</option>
          </select>
          <select id="bike-safety">
            <option value="balanced">Balanced</option>
            <option value="safe">Safer Route</option>
            <option value="fast">Fastest</option>
          </select>
          <button id="find-route-btn" class="primary-btn">Find Route</button>
        </div>
      </div>

      <!-- Floating Layers Button (bottom-right) -->
      <div id="layers-control" class="floating-layers">
        <button id="layers-btn" class="layers-btn" type="button" title="Map layers">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </button>

        <!-- Expanded Layers Panel -->
        <div id="layers-panel" class="layers-panel hidden">
          <h3>Map Layers</h3>
          <div class="layer-toggle">
            <label for="layer-bike">Bike Lanes</label>
            <input type="checkbox" id="layer-bike" checked />
          </div>
          <div class="layer-toggle">
            <label for="layer-metro-rail">Metro Rail</label>
            <input type="checkbox" id="layer-metro-rail" checked />
          </div>
          <div class="layer-toggle">
            <label for="layer-metro-brt">Metro BRT</label>
            <input type="checkbox" id="layer-metro-brt" checked />
          </div>
          <div class="layer-toggle">
            <label for="layer-ladot">LADOT</label>
            <input type="checkbox" id="layer-ladot" checked />
          </div>
          <div class="layer-toggle">
            <label for="layer-silver-streak">Silver Streak</label>
            <input type="checkbox" id="layer-silver-streak" checked />
          </div>
          <div class="layer-toggle future-toggle">
            <label for="layer-future">
              Future Lines
              <span class="future-badge">Preview</span>
            </label>
            <input type="checkbox" id="layer-future" />
          </div>
        </div>
      </div>

      <!-- Slide-in Results Sidebar -->
      <aside id="results-sidebar" class="results-sidebar">
        <div class="sidebar-header">
          <span class="logo">🚲 + 🚆</span>
          <span class="brand-name">VeloRail</span>
          <button id="close-sidebar" class="close-btn" type="button" title="Close">&times;</button>
        </div>
        <div id="route-details" class="route-details">
          <!-- Route info rendered here -->
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
