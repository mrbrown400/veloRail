# Overstory configuration
# See: https://github.com/overstory/overstory

project:
  name: veloRail
  root: /Users/kylebrown/veloRail
  canonicalBranch: main
  qualityGates:
    - name: Quality
      command: npm run quality
      description: tests, TypeScript checks, and production build pass
agents:
  manifestPath: .overstory/agent-manifest.json
  baseDir: .overstory/agent-defs
  maxConcurrent: 25
  staggerDelayMs: 2000
  maxDepth: 2
worktrees:
  baseDir: .overstory/worktrees
taskTracker:
  backend: seeds
  enabled: true
mulch:
  enabled: true
  domains: []
  primeFormat: markdown
merge:
  aiResolveEnabled: true
  reimagineEnabled: false
providers:
  anthropic:
    type: native
runtime:
  default: codex
  printCommand: codex
watchdog:
  tier0Enabled: true
  tier0IntervalMs: 30000
  tier1Enabled: false
  tier2Enabled: false
  staleThresholdMs: 300000
  zombieThresholdMs: 600000
  nudgeIntervalMs: 60000
models:
logging:
  verbose: false
  redactSecrets: true
